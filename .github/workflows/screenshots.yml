name: Desktop Screenshots
run-name: Screenshots ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job id (the dashboard sets this; letters, numbers, - or _)'
        required: true
        default: 'manual'
      urls:
        description: 'Links (new lines from the dashboard, or separated by commas)'
        required: true
      width:
        description: 'Screen width in pixels'
        type: choice
        options: ['1280', '1440', '1920']
        default: '1440'
      scale:
        description: 'Sharpness (2 = retina, bigger files)'
        type: choice
        options: ['1', '2']
        default: '1'
      full_page:
        description: 'Capture the full page instead of just the top screen'
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time so pushes to the screenshots branch never collide
concurrency:
  group: screenshots-output
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: screenshot-tool
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Open the screenshots branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" screenshots >/dev/null 2>&1; then
            git clone --depth 1 --branch screenshots "$REMOTE" out
          else
            mkdir out
            git -C out init -q -b screenshots
            git -C out remote add origin "$REMOTE"
          fi

      - name: Take screenshots
        working-directory: screenshot-tool
        env:
          JOB_ID: ${{ inputs.job_id }}
          URLS: ${{ inputs.urls }}
          WIDTH: ${{ inputs.width }}
          SCALE: ${{ inputs.scale }}
          FULL_PAGE: ${{ inputs.full_page }}
          OUT_ROOT: ../out/jobs
        run: node screenshot.mjs

      - name: Publish to the screenshots branch
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          cd out
          # keep only the newest 30 jobs
          if [ -d jobs ]; then
            ls -1 jobs | sort | head -n -30 | xargs -r -I{} rm -rf "jobs/{}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Screenshots $JOB_ID"
          git push origin screenshots || (git pull --rebase origin screenshots && git push origin screenshots)
